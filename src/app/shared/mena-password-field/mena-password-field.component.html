<div class="mena-password-field" [class.mena-password-field--user]="userStyle">
  <input
    [type]="visible ? 'text' : 'password'"
    [class]="inputClass"
    [placeholder]="placeholder"
    [disabled]="inputDisabled"
    [autocomplete]="autocomplete"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  <button
    type="button"
    class="mena-password-field__toggle"
    [disabled]="inputDisabled"
    (click)="toggleVisibility()"
    [attr.aria-label]="visible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
    [attr.aria-pressed]="visible"
    tabindex="-1"
  >
    <i class="fas" [class.fa-eye]="!visible" [class.fa-eye-slash]="visible" aria-hidden="true"></i>
  </button>
</div>
