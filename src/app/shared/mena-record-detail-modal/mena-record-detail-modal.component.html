<div *ngIf="open" class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable" role="document" (click)="$event.stopPropagation()">
    <div class="modal-content mena-modal border-0 shadow">
      <div class="modal-header border-0">
        <div>
          <h5 class="modal-title mb-0">{{ title }}</h5>
          <p *ngIf="subtitle" class="small text-muted mb-0 mt-1">{{ subtitle }}</p>
        </div>
        <button type="button" class="close" aria-label="Fermer" (click)="onClose()" [disabled]="loading">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body pt-0">
        <app-mena-loading *ngIf="loading" message="Chargement du détail…" [centered]="true" />
        <div *ngIf="!loading && fields.length" class="table-responsive">
          <table class="table table-sm table-bordered mb-0 mena-detail-table">
            <tbody>
              <tr *ngFor="let f of fields">
                <th scope="row" class="text-muted font-weight-normal" style="width: 38%; min-width: 10rem">
                  {{ f.label }}
                </th>
                <td class="text-break">{{ f.value }}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p *ngIf="!loading && !fields.length" class="text-muted mb-0">Aucune donnée à afficher.</p>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="onClose()" [disabled]="loading">
          Fermer
        </button>
      </div>
    </div>
  </div>
</div>
<div *ngIf="open" class="modal-backdrop fade show" (click)="onClose()"></div>
