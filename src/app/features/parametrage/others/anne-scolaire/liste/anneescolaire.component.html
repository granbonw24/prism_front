<div class="container-fluid px-2 px-sm-3">
  <h1 class="h3 mb-2 text-gray-800">Gestion des années scolaires</h1>
  <p class="mb-4 text-muted">
    Nombre d’années : <strong>{{ rows.length }}</strong>
  </p>

  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>

  <div class="card shadow mb-4 border-0">
    <div class="card-header py-3 d-flex flex-wrap align-items-center justify-content-between gap-2 bg-white border-bottom-0">
      <h6 class="m-0 font-weight-bold text-primary">Liste des années</h6>
      <app-mena-toolbar-btn
        *ngIf="canCreate"
        variant="add"
        label="Ajouter année scolaire"
        [routerLink]="['add']"
      />
    </div>
    <div class="card-body">
      <app-mena-loading *ngIf="loading" message="Chargement des années scolaires…" [centered]="true" />
      <div *ngIf="!loading" class="table-responsive">
        <table class="table table-bordered" width="100%" cellspacing="0">
          <thead>
            <tr>
              <th>Code</th>
              <th>Date début</th>
              <th>Date fin</th>
              <th>Thème</th>
              <th>Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="rows.length === 0">
              <td colspan="6" class="text-center text-muted">Aucune année scolaire.</td>
            </tr>
            <tr *ngFor="let row of rows">
              <td>{{ row.codeAnneeScolaire || '—' }}</td>
              <td>{{ row.debutAnneeScolaire || '—' }}</td>
              <td>{{ row.finAnneeScolaire || '—' }}</td>
              <td class="text-muted">—</td>
              <td>
                <span *ngIf="row.etatAnneeScolaire" class="badge badge-success">En cours</span>
                <span *ngIf="!row.etatAnneeScolaire" class="badge badge-secondary">—</span>
              </td>
              <td class="text-nowrap mena-col-actions">
                <div *ngIf="canModify" class="mena-row-actions flex-wrap justify-content-start">
                  <app-mena-row-action
                    variant="edit"
                    [routerLink]="['edit', row.id]"
                    title="Modifier"
                    ariaLabel="Modifier"
                  />
                  <app-mena-row-action
                    variant="delete"
                    title="Supprimer"
                    ariaLabel="Supprimer"
                    (clicked)="openDelete(row)"
                  />
                  <app-mena-row-action
                    variant="activate"
                    [title]="savingEtatId === row.id ? 'En cours…' : 'Activer (année en cours)'"
                    [ariaLabel]="savingEtatId === row.id ? 'En cours' : 'Activer'"
                    [disabled]="row.etatAnneeScolaire || savingEtatId === row.id"
                    (clicked)="setCourante(row)"
                  />
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<app-confirm-delete
  *ngIf="deleteTarget"
  title="Supprimer l’année scolaire"
  [targetLabel]="deleteTargetLabel"
  [errorMessage]="deleteErrorMessage"
  [deleting]="deleteSubmitting"
  (cancelled)="closeDelete()"
  (confirmed)="confirmDelete()"
/>
